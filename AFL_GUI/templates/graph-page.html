<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flask App</title>
    <link rel="stylesheet" href="../static/style.css">
</head>

<body>
    <div id="top-nav">
        <button class="tab-button" ><a class="nav-link" href="/">Create & Edit Solutions</a></button>
        <button class="tab-button"><a class="nav-link nav-link-current" href="/graph">Generate Graph</a></button>
        <div class="logo-area">
            <img src="../static/Icons/logo_text_large_dark.svg" alt="AFL Icon">
        </div>
    </div>

    <div id="screen-container">
        <div class="sidebar">
            <div id="sidebar-header-top">
                <div class="sidebar-search-row">
                    <input type="text" id="solutionSearch" class="styled-input" placeholder="Search solutions..." onkeyup="filterSolutions()">
                </div>
                <!-- tags section in the header -->
                <div class="tag-container tag-container-Centered" id="sidebarTagFilters">
                    <!-- adds in tags automatically -->
                </div>
            </div>
            
            
            <div id="sidebar-solution-list"></div>

            
            
        </div>

        <div id="graph-page" class="tab-content">
            <div id="graph-page-left">
                <div id="graph-output-box">graph box</div>

                <div id="graph-lower-left">
                    <div id="code-output-box">
                        <p>Output here</p>
                    </div>

                    <div id="graph-control-btns">
                        <button id="gen-graph-btn" class="primary-button"><img height="20px" src="../static/Icons/generate-arrow.png">Generate Graph</button>
                        <button id="download-graph-btn" class="primary-button"><img height="20px" src="../static/Icons/download-arrow.png">Download Graph</button>
                    </div>

                </div>
                

            </div>
            <div id="graph-page-right">
                <div id="dim" class="white-block">
                    <div id="dimesion-options">
                        <button id="2d-btn" class="dimension-btn dimension-btn-active">2D</button>
                        <button id="3d-btn" class="dimension-btn dimension-btn-not-active">3D</button>
                    </div>
                    <div id="dimensions">
                        
                            <select id="x-axis-dropdown" class="axis-dropdown styled-input">
                                <option value="">--Select X-Axis Component--</option>
                            </select>

                            <select id="y-axis-dropdown" class="axis-dropdown styled-input">
                                <option value="">--Select Y-Axis Component--</option>
                            </select>
                    
                        <div id="3d-settings" class="dimension-setting-not-active">
                            <select id="z-axis-dropdown" class="styled-input axis-dropdown">
                                <option value="">--Select Z-Axis Component--</option>
                                
                            </select>
                        </div>
                    </div>
                </div>


                <div id="target-vs-sweep" class="white-block">
                    <p style="background-color:#00464a;padding:6px;border-radius: 6px;color:white;width: fit-content;margin-top: 5px;"><strong>Sweep</strong></p>

                    <div id="target-settings" class="dimension-setting-active target-block-template">
                        <div id="target-blocks-all">
                            
                        </div>
                    </div>


                    <div id="sweep-settings" class="dimension-setting-not-active">
                        <p>Sweep Density</p>
                        <input type="text">
                    </div>
                </div>
                
                


            </div>
        </div>
    </div>
    <script src="../static/db.js"></script>
    <script src="../static/graph-script.js"></script>

</body>

</html>

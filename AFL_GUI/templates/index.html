            <div class="static-card">
                <div class="input-header" style="color: var(--primary-color); font-weight: bold; margin-bottom: 24px;">
                    CHEMICAL COMPONENTS
                </div>
                
                <div id="componentsList">
                        <div class="component-row">
                            <div class="component-col-name">
                                <label class="input-label">Component Name</label>
                                <input type="text" id="component-${count}" class="styled-input" placeholder="NaCl" value="${comp.name || ''}">
                            </div>
                            
                            <div class="component-col-amount">
                                <label class="input-label">Amount</label>
                                <input type="text" id="amount-${count}" class="styled-input" placeholder="0.00" value="${comp.amount || ''}" type="number">
                            </div>
                            
                            <div class="component-col-unit">
                                <label class="input-label">Unit</label>
                                <select id="unit-${count}" class="styled-input">
                                    <option value="" disabled selected>Unit...</option>
                                    <optgroup label="Mass">
                                        <option value="mg">mg</option>
                                        <option value="g">g</option>
                                        <option value="kg">kg</option>
                                    </optgroup>
                                    <optgroup label="Volume">
                                        <option value="ul">ul</option>
                                        <option value="ml">ml</option>
                                        <option value="L">L</option>
                                    </optgroup>
                                    <optgroup label="Concentration">
                                        <option value="mg/ml">mg/ml</option>
                                        <option value="g/L">g/L</option>
                                    </optgroup>
                                </select>
                            </div>
                            <div class="component-col-action"></div>
                        </div>

                </div>
                
                <button id="addComponentButton" type="button" class="icon-button" style="color: var(--primary-color); font-weight: 600; margin-top: 16px; width: fit-content; gap: 8px; font-size: 14px;" onclick="addComponent()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="8" x2="12" y2="16"></line>
                        <line x1="8" y1="12" x2="16" y2="12"></line>
                    </svg>
                    Add Component
